<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}Lokal Booking Drammen{% endblock %}</title>
	<link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
	<header>
		<nav>
			<a href="{% url 'home' %}">Home</a>
			{% if request.user.is_authenticated %}
				<a href="{% url 'bookings:index' %}">My bookings</a>
				<a href="{% url 'bookings:create' %}">Create booking</a>
				{% if request.user.is_staff %}
					<a href="{% url 'dashboard:index' %}">Dashboard</a>
				{% endif %}
				<form class="inline-form" action="{% url 'logout' %}" method="post">
					{% csrf_token %}
					<button class="btn-secondary" type="submit">Log out</button>
				</form>
			{% else %}
				<a href="{% url 'login' %}">Log in</a>
			{% endif %}
		</nav>
	</header>
	<main>
		{% if messages %}
			<div class="card">
				{% for message in messages %}
					<p class="msg-{{ message.tags }}">{{ message }}</p>
				{% endfor %}
			</div>
		{% endif %}
		{% block content %}{% endblock %}
	</main>
</body>
</html>
